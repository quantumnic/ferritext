name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --exclude ferritext-py -- -D warnings

      - name: Test
        run: cargo test --workspace --exclude ferritext-py

      - name: Build release
        run: cargo build --release --workspace --exclude ferritext-py

      - name: Binary size
        run: |
          ls -lh target/release/libferritext_ffi.so 2>/dev/null || true
          ls -lh target/release/*.so 2>/dev/null || true
