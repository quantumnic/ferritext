[package]
name = "ferritext-py"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Python bindings for ferritext OCR engine"

[lib]
name = "ferritext"
crate-type = ["cdylib"]

[dependencies]
ferritext-core = { path = "../ferritext-core" }
pyo3 = "0.22"  # extension-module is enabled by maturin (pyproject.toml)
